<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 TARYA SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: #e6edf3;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        
        /* ===== پس‌زمینه متحرک سفید و مشکی ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #0a0a0f;
        }
        
        .bg-animation .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.02) 10%,
                transparent 20%,
                rgba(255, 255, 255, 0.03) 30%,
                transparent 40%,
                rgba(255, 255, 255, 0.01) 50%,
                transparent 60%
            );
            animation: waveMove 20s linear infinite;
        }
        
        .bg-animation .wave:nth-child(1) {
            animation-duration: 15s;
            opacity: 0.3;
            transform: translateY(0);
        }
        
        .bg-animation .wave:nth-child(2) {
            animation-duration: 25s;
            opacity: 0.2;
            transform: translateY(-20%);
            animation-delay: -5s;
        }
        
        .bg-animation .wave:nth-child(3) {
            animation-duration: 35s;
            opacity: 0.15;
            transform: translateY(-40%);
            animation-delay: -10s;
        }
        
        .bg-animation .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }
        
        .bg-animation .glow-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            animation: ringPulse 8s ease-in-out infinite;
        }
        
        .bg-animation .glow-ring:nth-child(10) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: -5%;
            animation-delay: 0s;
        }
        
        .bg-animation .glow-ring:nth-child(11) {
            width: 500px;
            height: 500px;
            bottom: -10%;
            right: -10%;
            animation-delay: -3s;
        }
        
        .bg-animation .glow-ring:nth-child(12) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -6s;
        }
        
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }
        
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        
        /* ===== محتوا ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 20px;
        }
        
        /* ===== هدر ===== */
        .header {
            text-align: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
            position: relative;
        }
        
        .header .logo {
            font-family: 'Orbitron', monospace;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
        }
        
        .header .logo span {
            background: linear-gradient(135deg, #f0883e, #f0a83e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        .header .badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* ===== کارت محصول ===== */
        .product-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .product-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .product-card .info { flex: 1; min-width: 120px; }
        
        .product-card .name {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            letter-spacing: 0.5px;
        }
        
        .product-card .price {
            color: #3fb950;
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
        }
        
        .product-card .stock {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-top: 2px;
        }
        
        .product-card .stock.low { color: #f85149; }
        
        /* ===== دکمه‌ها ===== */
        .btn {
            background: linear-gradient(135deg, #ffffff, #cccccc);
            color: #0a0a0f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .btn:hover::before { opacity: 1; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(255,255,255,0.15); }
        .btn:active { transform: scale(0.97); }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(255,255,255,0.05);
        }
        
        .btn-block { width: 100%; margin-top: 8px; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        
        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 20px 0 10px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 16px;
            letter-spacing: 1px;
        }
        
        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: 0.3s;
        }
        
        .footer a:hover { color: rgba(255, 255, 255, 0.5); }
        
        /* ===== توست ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e6edf3;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
        }
        
        .toast.error { border-color: rgba(248, 81, 73, 0.3); }
        .toast.success { border-color: rgba(63, 185, 80, 0.3); }
        
        /* ===== ریسپانسیو ===== */
        @media (max-width: 400px) {
            .header .logo { font-size: 26px; }
            .product-card { flex-direction: column; align-items: stretch; }
            .product-card .actions { display: flex; justify-content: flex-start; }
        }
        
        /* اسکرول بار */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
        
        /* انتخاب */
        ::selection { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
    </style>
</head>
<body>
    
    <!-- ===== پس‌زمینه متحرک ===== -->
    <div class="bg-animation" id="bgAnimation">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
    </div>
    
    <div class="container">
        
        <!-- ===== هدر ===== -->
        <div class="header">
            <div class="logo">🔥 <span>TARYA</span> SHOP</div>
            <div class="subtitle">✦ Premium Store ✦</div>
            <div class="badge">⚡ خرید با بهترین قیمت</div>
        </div>
        
        <!-- ===== محصولات ===== -->
        <div id="productList">
            <div style="text-align:center;padding:40px 0;color:rgba(255,255,255,0.3);font-size:14px;letter-spacing:1px;">
                ⏳ بارگذاری محصولات...
            </div>
        </div>
        
        <!-- ===== دکمه ربات ===== -->
        <button class="btn btn-secondary btn-block" onclick="openBot()">
            🤖 باز کردن ربات TARYA
        </button>
        
        <!-- ===== فوتر ===== -->
        <div class="footer">
            🔥 <a href="https://t.me/VELORIX_VPN" target="_blank">TARYA SHOP</a> • 
            📞 <a href="https://t.me/PW_AQ" target="_blank">پشتیبانی</a>
        </div>
    </div>
    
    <!-- ===== توست ===== -->
    <div class="toast" id="toast"></div>
    
    <script>
        // ============================================================
        // تنظیمات
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const BOT_USERNAME = 'taryashopbot';
        const BOT_LINK = `https://t.me/${BOT_USERNAME}`;
        
        // ============================================================
        // محصولات
        // ============================================================
        const products = [
            { id: 1, name: '⭐ 50 استارز', price: 160000, stock: 999 },
            { id: 2, name: '🚀 بوست 7 روزه (10 عددی)', price: 60000, stock: 999 }
        ];
        
        // ============================================================
        // توابع
        // ============================================================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.style.display = 'none'; }, 3000);
        }
        
        function openBot() {
            tg.openTelegramLink(BOT_LINK);
        }
        
        function buyProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const isStars = product.name.includes('استارز');
            const command = isStars ? '/buystars' : '/buyboost';
            
            tg.openTelegramLink(`${BOT_LINK}?start=${command.substring(1)}`);
            showToast(`✅ در حال باز کردن ربات برای خرید ${product.name}...`, 'success');
        }
        
        function renderProducts() {
            const container = document.getElementById('productList');
            let html = '';
            
            products.forEach(p => {
                const stockClass = p.stock < 10 ? 'low' : '';
                html += `
                    <div class="product-card">
                        <div class="info">
                            <div class="name">${p.name}</div>
                            <div class="price">💰 ${p.price.toLocaleString()} تومان</div>
                            <div class="stock ${stockClass}">📊 موجودی: ${p.stock}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-sm" onclick="buyProduct(${p.id})">🛒 خرید</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================================
        // ساخت ذرات پس‌زمینه
        // ============================================================
        function createParticles() {
            const container = document.getElementById('bgAnimation');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 2 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                particle.style.opacity = Math.random() * 0.3 + 0.1;
                container.appendChild(particle);
            }
        }
        
        // ============================================================
        // اجرا
        // ============================================================
        renderProducts();
        createParticles();
        
        // تنظیم تم تلگرام
        tg.setBackgroundColor('#0a0a0f');
        tg.setHeaderColor('#0a0a0f');
    </script>
</body>
</html>
