<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 TARYA SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e6edf3;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        
        /* ============================================================
           پس‌زمینه متحرک حرفه‌ای
           ============================================================ */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #0a0a0f;
        }
        
        /* گرادیانت متحرک */
        .bg-animation .gradient-move {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 50%, rgba(255,255,255,0.02) 0%, transparent 60%);
            animation: gradientMove 20s ease-in-out infinite;
        }
        .bg-animation .gradient-move:nth-child(1) { animation-delay: 0s; }
        .bg-animation .gradient-move:nth-child(2) { animation-delay: -7s; animation-duration: 25s; }
        .bg-animation .gradient-move:nth-child(3) { animation-delay: -14s; animation-duration: 30s; }
        
        @keyframes gradientMove {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            25% { transform: translate(5%, 8%) scale(1.1); opacity: 0.8; }
            50% { transform: translate(-8%, 5%) scale(0.9); opacity: 0.5; }
            75% { transform: translate(10%, -5%) scale(1.05); opacity: 0.7; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        }
        
        /* خطوط نورانی متحرک */
        .bg-animation .light-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            animation: lightLineMove linear infinite;
            border-radius: 50%;
        }
        .bg-animation .light-line:nth-child(4) { width: 70%; top: 10%; left: -20%; animation-duration: 14s; }
        .bg-animation .light-line:nth-child(5) { width: 50%; top: 40%; left: -10%; animation-duration: 20s; animation-delay: -5s; height: 1px; }
        .bg-animation .light-line:nth-child(6) { width: 60%; top: 70%; left: -30%; animation-duration: 18s; animation-delay: -10s; }
        .bg-animation .light-line:nth-child(7) { width: 40%; top: 85%; left: -5%; animation-duration: 22s; animation-delay: -3s; height: 1px; }
        
        @keyframes lightLineMove {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(110vw); opacity: 0; }
        }
        
        /* ذرات درخشان (ستاره‌ها) */
        .bg-animation .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
            animation: starFloat linear infinite;
        }
        .bg-animation .star:nth-child(8) { left: 5%; animation-duration: 22s; animation-delay: 0s; }
        .bg-animation .star:nth-child(9) { left: 15%; animation-duration: 28s; animation-delay: -4s; width: 2px; height: 2px; }
        .bg-animation .star:nth-child(10) { left: 25%; animation-duration: 18s; animation-delay: -8s; }
        .bg-animation .star:nth-child(11) { left: 35%; animation-duration: 25s; animation-delay: -2s; width: 4px; height: 4px; }
        .bg-animation .star:nth-child(12) { left: 45%; animation-duration: 30s; animation-delay: -12s; }
        .bg-animation .star:nth-child(13) { left: 55%; animation-duration: 20s; animation-delay: -6s; width: 2px; height: 2px; }
        .bg-animation .star:nth-child(14) { left: 65%; animation-duration: 26s; animation-delay: -10s; }
        .bg-animation .star:nth-child(15) { left: 75%; animation-duration: 16s; animation-delay: -1s; width: 4px; height: 4px; }
        .bg-animation .star:nth-child(16) { left: 85%; animation-duration: 24s; animation-delay: -7s; }
        .bg-animation .star:nth-child(17) { left: 95%; animation-duration: 32s; animation-delay: -15s; width: 2px; height: 2px; }
        
        @keyframes starFloat {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(0); opacity: 0; }
        }
        
        /* دایره‌های نوری */
        .bg-animation .glow-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.03);
            animation: glowPulse 10s ease-in-out infinite;
        }
        .bg-animation .glow-circle:nth-child(18) {
            width: 400px; height: 400px;
            top: 0%; right: -10%;
            animation-delay: 0s;
        }
        .bg-animation .glow-circle:nth-child(19) {
            width: 600px; height: 600px;
            bottom: -20%; left: -20%;
            animation-delay: -5s;
            border-color: rgba(255,255,255,0.02);
        }
        .bg-animation .glow-circle:nth-child(20) {
            width: 250px; height: 250px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -3s;
            border-color: rgba(255,255,255,0.04);
        }
        .bg-animation .glow-circle:nth-child(21) {
            width: 150px; height: 150px;
            top: 20%; left: 10%;
            animation-delay: -7s;
            border-color: rgba(255,255,255,0.05);
        }
        .bg-animation .glow-circle:nth-child(22) {
            width: 180px; height: 180px;
            bottom: 15%; right: 10%;
            animation-delay: -2s;
            border-color: rgba(255,255,255,0.04);
        }
        
        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.4); opacity: 0.7; }
        }
        
        /* ============================================================
           محتوا
           ============================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 20px;
        }
        
        /* ===== هدر ===== */
        .header {
            text-align: center;
            padding: 22px 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
            position: relative;
        }
        .header .logo {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #888888 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 80px rgba(255,255,255,0.03);
            letter-spacing: 3px;
        }
        .header .logo span {
            background: linear-gradient(135deg, #f0883e, #f0a83e, #f0883e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: goldShine 3s ease-in-out infinite;
        }
        @keyframes goldShine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .subtitle {
            color: rgba(255,255,255,0.25);
            font-size: 11px;
            margin-top: 4px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
        }
        .header .badge {
            display: inline-block;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.35);
            border: 1px solid rgba(255,255,255,0.04);
            letter-spacing: 1px;
        }
        .header .badge::before {
            content: '⚡ ';
        }
        
        /* ===== محصولات ===== */
        .product-card {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.4s ease;
        }
        .product-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .product-card .info { flex: 1; min-width: 120px; }
        .product-card .name {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            letter-spacing: 0.3px;
        }
        .product-card .price {
            color: #3fb950;
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
        }
        .product-card .price::before {
            content: '💰 ';
        }
        .product-card .stock {
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            margin-top: 2px;
        }
        .product-card .stock::before {
            content: '📊 ';
        }
        .product-card .stock.low { color: #f85149; }
        
        /* ===== دکمه‌ها ===== */
        .btn {
            background: linear-gradient(135deg, #ffffff, #d0d0d0);
            color: #0a0a0f;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::before { opacity: 1; }
        .btn:hover { transform: scale(1.03); box-shadow: 0 4px 30px rgba(255,255,255,0.1); }
        .btn:active { transform: scale(0.97); }
        
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            color: #e6edf3;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            box-shadow: 0 4px 30px rgba(255,255,255,0.02);
        }
        .btn-block { width: 100%; margin-top: 10px; padding: 12px; }
        .btn-sm { padding: 6px 16px; font-size: 12px; }
        
        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 22px 0 12px;
            color: rgba(255,255,255,0.08);
            font-size: 11px;
            border-top: 1px solid rgba(255,255,255,0.02);
            margin-top: 18px;
            letter-spacing: 1.5px;
        }
        .footer a {
            color: rgba(255,255,255,0.12);
            text-decoration: none;
            transition: 0.3s;
        }
        .footer a:hover { color: rgba(255,255,255,0.35); }
        
        /* ===== توست ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.04);
            color: #e6edf3;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
            font-weight: 400;
        }
        .toast.error { border-color: rgba(248,81,73,0.15); }
        .toast.success { border-color: rgba(63,185,80,0.15); }
        
        /* ===== ریسپانسیو ===== */
        @media (max-width: 400px) {
            .header .logo { font-size: 28px; }
            .product-card { flex-direction: column; align-items: stretch; }
            .product-card .actions { display: flex; justify-content: flex-start; }
            .header .subtitle { font-size: 10px; letter-spacing: 4px; }
        }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }
        ::selection { background: rgba(255,255,255,0.05); color: #ffffff; }
    </style>
</head>
<body>
    
    <!-- ============================================================
    پس‌زمینه متحرک حرفه‌ای
    ============================================================ -->
    <div class="bg-animation" id="bgAnimation">
        <!-- گرادیانت‌های متحرک -->
        <div class="gradient-move"></div>
        <div class="gradient-move"></div>
        <div class="gradient-move"></div>
        
        <!-- خطوط نورانی -->
        <div class="light-line"></div>
        <div class="light-line"></div>
        <div class="light-line"></div>
        <div class="light-line"></div>
        
        <!-- ستاره‌ها (ذرات) -->
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        
        <!-- دایره‌های نوری -->
        <div class="glow-circle"></div>
        <div class="glow-circle"></div>
        <div class="glow-circle"></div>
        <div class="glow-circle"></div>
        <div class="glow-circle"></div>
    </div>
    
    <div class="container">
        
        <!-- ===== هدر ===== -->
        <div class="header">
            <div class="logo">🔥 <span>TARYA</span> SHOP</div>
            <div class="subtitle">✦ Premium Store ✦</div>
            <div class="badge">خرید با بهترین قیمت</div>
        </div>
        
        <!-- ===== محصولات ===== -->
        <div id="productList">
            <div style="text-align:center;padding:40px 0;color:rgba(255,255,255,0.15);font-size:14px;letter-spacing:1px;">
                ⏳ بارگذاری محصولات...
            </div>
        </div>
        
        <!-- ===== دکمه ربات ===== -->
        <button class="btn btn-secondary btn-block" onclick="openBot()">
            🤖 باز کردن ربات TARYA
        </button>
        
        <!-- ===== فوتر ===== -->
        <div class="footer">
            🔥 <a href="https://t.me/VELORIX_VPN" target="_blank">TARYA SHOP</a> • 
            📞 <a href="https://t.me/PW_AQ" target="_blank">پشتیبانی</a>
        </div>
    </div>
    
    <!-- ===== توست ===== -->
    <div class="toast" id="toast"></div>
    
    <script>
        // ============================================================
        // تنظیمات اولیه
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const BOT_USERNAME = 'taryashopbot';
        const BOT_LINK = `https://t.me/${BOT_USERNAME}`;
        
        // ============================================================
        // محصولات با کامندهای ربات
        // ============================================================
        const products = [
            { id: 1, name: '⭐ 50 استارز', price: 160000, stock: 999, command: 'buystars' },
            { id: 2, name: '🚀 بوست 7 روزه (10 عددی)', price: 60000, stock: 999, command: 'buyboost' }
        ];
        
        // ============================================================
        // توابع
        // ============================================================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.style.display = 'none'; }, 3000);
        }
        
        function openBot() {
            tg.openTelegramLink(BOT_LINK);
        }
        
        function buyProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            // ارسال کامند از طریق deep link
            const url = `${BOT_LINK}?start=${product.command}`;
            tg.openTelegramLink(url);
            
            showToast(`✅ در حال باز کردن ربات برای ${product.name}...`, 'success');
        }
        
        function renderProducts() {
            const container = document.getElementById('productList');
            let html = '';
            
            products.forEach(p => {
                const stockClass = p.stock < 10 ? 'low' : '';
                html += `
                    <div class="product-card">
                        <div class="info">
                            <div class="name">${p.name}</div>
                            <div class="price">${p.price.toLocaleString()} تومان</div>
                            <div class="stock ${stockClass}">موجودی: ${p.stock}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-sm" onclick="buyProduct(${p.id})">🛒 خرید</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================================
        // اجرا
        // ============================================================
        renderProducts();
        
        // تنظیمات تلگرام
        tg.setBackgroundColor('#0a0a0f');
        tg.setHeaderColor('#0a0a0f');
    </script>
</body>
</html>
