<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 TARYA SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e6edf3;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        
        /* ============================================================
           پس‌زمینه متحرک قوی
           ============================================================ */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #0a0a0f;
        }
        
        /* امواج بزرگ */
        .bg-animation .wave-big {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 70%);
            animation: waveBig 15s ease-in-out infinite;
        }
        .bg-animation .wave-big:nth-child(1) { animation-delay: 0s; }
        .bg-animation .wave-big:nth-child(2) { animation-delay: -5s; animation-duration: 20s; }
        .bg-animation .wave-big:nth-child(3) { animation-delay: -10s; animation-duration: 25s; }
        
        @keyframes waveBig {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            25% { transform: translate(10%, 5%) scale(1.1); opacity: 0.5; }
            50% { transform: translate(-5%, 10%) scale(0.9); opacity: 0.3; }
            75% { transform: translate(15%, -5%) scale(1.05); opacity: 0.4; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        }
        
        /* خطوط متحرک */
        .bg-animation .line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: lineMove linear infinite;
        }
        .bg-animation .line:nth-child(4) { width: 60%; top: 15%; left: -20%; animation-duration: 12s; }
        .bg-animation .line:nth-child(5) { width: 40%; top: 45%; left: -10%; animation-duration: 18s; animation-delay: -4s; }
        .bg-animation .line:nth-child(6) { width: 50%; top: 75%; left: -30%; animation-duration: 15s; animation-delay: -8s; }
        
        @keyframes lineMove {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }
        
        /* ذرات درخشان */
        .bg-animation .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255,255,255,0.3);
            animation: sparkleFloat linear infinite;
        }
        .bg-animation .sparkle:nth-child(7) { left: 10%; animation-duration: 20s; animation-delay: 0s; }
        .bg-animation .sparkle:nth-child(8) { left: 30%; animation-duration: 25s; animation-delay: -5s; }
        .bg-animation .sparkle:nth-child(9) { left: 50%; animation-duration: 18s; animation-delay: -10s; }
        .bg-animation .sparkle:nth-child(10) { left: 70%; animation-duration: 22s; animation-delay: -3s; }
        .bg-animation .sparkle:nth-child(11) { left: 90%; animation-duration: 28s; animation-delay: -7s; }
        .bg-animation .sparkle:nth-child(12) { left: 20%; animation-duration: 30s; animation-delay: -12s; }
        .bg-animation .sparkle:nth-child(13) { left: 60%; animation-duration: 16s; animation-delay: -2s; }
        .bg-animation .sparkle:nth-child(14) { left: 80%; animation-duration: 24s; animation-delay: -9s; }
        
        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }
        
        /* حلقه‌های نوری */
        .bg-animation .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.03);
            animation: ringPulse 8s ease-in-out infinite;
        }
        .bg-animation .ring:nth-child(15) {
            width: 350px; height: 350px;
            top: 5%; right: -10%;
            animation-delay: 0s;
        }
        .bg-animation .ring:nth-child(16) {
            width: 500px; height: 500px;
            bottom: -15%; left: -15%;
            animation-delay: -4s;
        }
        .bg-animation .ring:nth-child(17) {
            width: 200px; height: 200px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
        }
        
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        
        /* ============================================================
           محتوا
           ============================================================ */
        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 20px;
        }
        
        /* ===== هدر ===== */
        .header {
            text-align: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 16px;
        }
        .header .logo {
            font-family: 'Orbitron', monospace;
            font-size: 34px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(255,255,255,0.05);
            letter-spacing: 2px;
        }
        .header .logo span {
            background: linear-gradient(135deg, #f0883e, #f0a83e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .subtitle {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 4px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .header .badge {
            display: inline-block;
            padding: 3px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* ===== کارت محصول ===== */
        .product-card {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.4s ease;
        }
        .product-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .product-card .info { flex: 1; min-width: 120px; }
        .product-card .name {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            letter-spacing: 0.3px;
        }
        .product-card .price {
            color: #3fb950;
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
        }
        .product-card .stock {
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            margin-top: 2px;
        }
        .product-card .stock.low { color: #f85149; }
        
        /* ===== دکمه‌ها ===== */
        .btn {
            background: linear-gradient(135deg, #ffffff, #dddddd);
            color: #0a0a0f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::before { opacity: 1; }
        .btn:hover { transform: scale(1.03); box-shadow: 0 4px 25px rgba(255,255,255,0.12); }
        .btn:active { transform: scale(0.97); }
        
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            color: #e6edf3;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            box-shadow: 0 4px 25px rgba(255,255,255,0.03);
        }
        .btn-block { width: 100%; margin-top: 8px; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        
        /* ===== فوتر ===== */
        .footer {
            text-align: center;
            padding: 20px 0 10px;
            color: rgba(255,255,255,0.1);
            font-size: 11px;
            border-top: 1px solid rgba(255,255,255,0.02);
            margin-top: 16px;
            letter-spacing: 1.5px;
        }
        .footer a {
            color: rgba(255,255,255,0.15);
            text-decoration: none;
            transition: 0.3s;
        }
        .footer a:hover { color: rgba(255,255,255,0.4); }
        
        /* ===== توست ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.04);
            color: #e6edf3;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
        }
        .toast.error { border-color: rgba(248,81,73,0.2); }
        .toast.success { border-color: rgba(63,185,80,0.2); }
        
        /* ===== ریسپانسیو ===== */
        @media (max-width: 400px) {
            .header .logo { font-size: 26px; }
            .product-card { flex-direction: column; align-items: stretch; }
            .product-card .actions { display: flex; justify-content: flex-start; }
        }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }
        ::selection { background: rgba(255,255,255,0.05); color: #ffffff; }
    </style>
</head>
<body>
    
    <!-- ============================================================
    پس‌زمینه متحرک
    ============================================================ -->
    <div class="bg-animation" id="bgAnimation">
        <!-- امواج بزرگ -->
        <div class="wave-big"></div>
        <div class="wave-big"></div>
        <div class="wave-big"></div>
        
        <!-- خطوط متحرک -->
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        
        <!-- ذرات درخشان -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        
        <!-- حلقه‌های نوری -->
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>
    
    <div class="container">
        
        <!-- ===== هدر ===== -->
        <div class="header">
            <div class="logo">🔥 <span>TARYA</span> SHOP</div>
            <div class="subtitle">✦ Premium Store ✦</div>
            <div class="badge">⚡ خرید با بهترین قیمت</div>
        </div>
        
        <!-- ===== محصولات ===== -->
        <div id="productList">
            <div style="text-align:center;padding:40px 0;color:rgba(255,255,255,0.2);font-size:14px;letter-spacing:1px;">
                ⏳ بارگذاری محصولات...
            </div>
        </div>
        
        <!-- ===== دکمه ربات ===== -->
        <button class="btn btn-secondary btn-block" onclick="openBot()">
            🤖 باز کردن ربات TARYA
        </button>
        
        <!-- ===== فوتر ===== -->
        <div class="footer">
            🔥 <a href="https://t.me/VELORIX_VPN" target="_blank">TARYA SHOP</a> • 
            📞 <a href="https://t.me/PW_AQ" target="_blank">پشتیبانی</a>
        </div>
    </div>
    
    <!-- ===== توست ===== -->
    <div class="toast" id="toast"></div>
    
    <script>
        // ============================================================
        // تنظیمات
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const BOT_USERNAME = 'taryashopbot';
        const BOT_LINK = `https://t.me/${BOT_USERNAME}`;
        
        // ============================================================
        // محصولات با کامندهای ربات
        // ============================================================
        const products = [
            { id: 1, name: '⭐ 50 استارز', price: 160000, stock: 999, command: '/buystars' },
            { id: 2, name: '🚀 بوست 7 روزه (10 عددی)', price: 60000, stock: 999, command: '/buyboost' }
        ];
        
        // ============================================================
        // توابع
        // ============================================================
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.style.display = 'none'; }, 3000);
        }
        
        function openBot() {
            tg.openTelegramLink(BOT_LINK);
        }
        
        function buyProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            // ارسال کامند به ربات
            const command = product.command;
            tg.openTelegramLink(`${BOT_LINK}?start=${command.substring(1)}`);
            
            showToast(`✅ در حال باز کردن ربات برای ${product.name}...`, 'success');
        }
        
        function renderProducts() {
            const container = document.getElementById('productList');
            let html = '';
            
            products.forEach(p => {
                const stockClass = p.stock < 10 ? 'low' : '';
                html += `
                    <div class="product-card">
                        <div class="info">
                            <div class="name">${p.name}</div>
                            <div class="price">💰 ${p.price.toLocaleString()} تومان</div>
                            <div class="stock ${stockClass}">📊 موجودی: ${p.stock}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-sm" onclick="buyProduct(${p.id})">🛒 خرید</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ============================================================
        // اجرا
        // ============================================================
        renderProducts();
        
        tg.setBackgroundColor('#0a0a0f');
        tg.setHeaderColor('#0a0a0f');
    </script>
</body>
</html>
